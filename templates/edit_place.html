<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modifica elemento</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Modifica elemento</h1>
  <form method="post">
    <label>Titolo / nome
      <input name="name" value="{{ place['name'] }}" required>
    </label>
    <label>Stanza
      <select name="room">
        <option value="">Nessuna stanza</option>
        {% for room in ['camera letto ale', 'studio', 'garage', 'salotto', 'bagno', 'corridoio'] %}
          <option value="{{ room }}" {% if place['room'] == room %}selected{% endif %}>{{ room }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Salva modifiche</button>
    <a class="button-link" href="/">Annulla</a>
  </form>
</body>
</html>
