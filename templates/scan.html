<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner QR</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #video { width: 100%; max-width: 400px; border: 1px solid #ccc; }
    #result { margin-top: 15px; font-weight: bold; }
    button { margin-top: 15px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Scanner QR</h1>
  <video id="video" autoplay playsinline></video>
  <div id="result">Inquadra il QR code...</div>
  <button id="startCamera" type="button">Attiva fotocamera</button>
  <a id="goLink" style="display:none;">Vai all'upload</a>

  <script>
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    const startCamera = document.getElementById('startCamera');
    const goLink = document.getElementById('goLink');

    startCamera.addEventListener('click', async () => {
      if (!window.isSecureContext || !navigator.mediaDevices) {
        resultDiv.textContent = 'Apri questa pagina con HTTPS per usare la fotocamera.';
        return;
      }

      startCamera.disabled = true;
      resultDiv.textContent = 'Richiesta accesso alla fotocamera...';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        video.srcObject = stream;
        resultDiv.textContent = 'Inquadra il QR code...';
        scan();
      } catch (err) {
        startCamera.disabled = false;
        resultDiv.textContent = 'Errore fotocamera: ' + err.message;
      }
    });

    function scan() {
      if (video.videoWidth === 0) {
        setTimeout(scan, 200);
        return;
      }

      let barcodeDetector = null;
      try {
        if ('BarcodeDetector' in window) {
          barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        }
      } catch (err) {
        barcodeDetector = null;
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      async function frame() {
        if (barcodeDetector) {
          try {
            const codes = await barcodeDetector.detect(video);
            if (codes.length > 0) {
              lookupPlace(codes[0].rawValue);
              return;
            }
          } catch (err) {
            barcodeDetector = null;
          }
        }

        if (typeof jsQR !== 'function') {
          resultDiv.textContent = 'Scanner QR non disponibile. Ricarica la pagina.';
          startCamera.disabled = false;
          return;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code) {
          lookupPlace(code.data);
          return;
        }

        requestAnimationFrame(frame);
      }
      frame();
    }

    async function lookupPlace(uuid) {
      resultDiv.textContent = 'QR trovato. Cerco l\'elemento...';
      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uuid })
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'Elemento non trovato');
        }

        resultDiv.textContent = 'Elemento trovato: ' + data.place.name;
        goLink.href = '/upload/' + encodeURIComponent(data.place.uuid);
        goLink.style.display = 'inline-block';
        goLink.textContent = 'Carica immagine per questo elemento';
      } catch (err) {
        resultDiv.textContent = 'Errore: ' + err.message;
        startCamera.disabled = false;
      }
    }
  </script>
</body>
</html>
