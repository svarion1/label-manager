<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carica immagine - {{ place.name }}</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input[type="file"] { margin: 15px 0; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>{{ place.name }}</h1>
  {% if place.room %}
    <p>Stanza: {{ place.room }}</p>
  {% endif %}
  <p>ID: {{ place.id }} | UUID: {{ place.uuid[:8] }}...</p>

  <form method="post" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*" capture="environment" required>
    <label>Titolo oggetto
      <input type="text" name="title" placeholder="Es. trapano blu" required>
    </label>
    <label>Categoria
      <input type="text" name="category" placeholder="Es. utensili">
    </label>
    <label>Sottocategoria
      <input type="text" name="subcategory" placeholder="Es. elettrici">
    </label>
    <br>
    <button type="submit">Carica</button>
  </form>

  <p><a href="/scan">← Torna allo scanner</a></p>
</body>
</html>
