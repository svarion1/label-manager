<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caricata - {{ place.name }}</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .gallery img { max-width: 150px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>{{ place.name }}</h1>
  <p>Stanza: {{ place.room or 'non assegnata' }}</p>

  <h2>Immagini salvate ({{ images|length }})</h2>
  <div class="gallery">
    {% for img in images %}
      <figure>
        <img src="{{ url_for('uploaded_file', filename=img.filename) }}" alt="{{ img.title }}">
        <figcaption><strong>{{ img.title or 'Oggetto senza titolo' }}</strong><br>{{ img.category or 'Senza categoria' }}{% if img.subcategory %} · {{ img.subcategory }}{% endif %}<br><a href="{{ url_for('edit_object', image_id=img.id) }}">Modifica oggetto</a></figcaption>
      </figure>
    {% endfor %}
  </div>

  <p><a href="/">← Torna al catalogo</a> · <a href="/scan">Scannerizza un altro QR</a></p>
</body>
</html>
